<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Interface</title>
    <link rel="stylesheet" href="style-session.css">
    <link rel="stylesheet" href="all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-info">
                <h1>Session with Dr. Laila Hassan</h1>
                <p>Duration: 18:42 · End: 11:50 AM</p>
            </div>
            <div class="header-actions">
                <span class="live-indicator">● Live</span>
                <button class="notes-btn">Session Notes</button>
            </div>
        </header>

        <!-- Video Main Area -->
        <div class="video-container">
            <div class="main-video">
                <div class="placeholder-icon">👤</div>
                <p>therapist camera</p>
                <div class="name-tag">Dr. Laila Hassan</div>
            </div>
            <div class="mini-video">
                <span>You</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="control-btn">
                <i class="fa-solid fa-microphone" style="color: #5D768B;"></i>
            </button>
            <button class="control-btn">
                <i class="fa-solid fa-video" style="color: #5D768B;"></i>
            </button>
            <button class="control-btn">
                <i class="fa-solid fa-file" style="color: #5D768B;"></i>
            </button>
            <button class="control-btn">
                <i class="fa-solid fa-comment" style="color: #5D768B;"></i>
            </button>
            <button class="control-btn end-call" onclick="window.location.href='home.html'">
                 ✕
            </button>
        </div>

        <!-- Bottom Sections -->
        <div class="bottom-sections">
            <div class="card">
                <h3>Session Notes</h3>
                <textarea placeholder="Private notes for this session..."></textarea>
            </div>
            <div class="card">
                <h3>Resources Shared</h3>
                <p class="share-text">Dr. Hassan shared:</p>
                <div class="file-item">
                    <span>📄</span> CBT Worksheet — Thought Records.pdf
                </div>
            </div>
        </div>
    </div>

</body>
</html>
